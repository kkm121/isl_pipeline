version: '3.8'

services:
  # 1. Sealed Sandbox Runner: Strictly Offline, Zero Network Access
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    network_mode: none
    volumes:
      - ../src:/workspace/src:ro
      - ../tests:/workspace/tests:ro
      - ../configs:/workspace/configs:ro
      - sandbox-results:/workspace/results
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges

  # 2. Integration Runner: Standard Bridge Network for Remote CLI/API orchestration
  # Note: Credentials are NEVER mounted into the container. Authenticated operations are performed
  # strictly via the host Account Broker / MCP process.
  integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    networks:
      - host-bridge
    volumes:
      - ../src:/workspace/src:ro
      - ../kaggle:/workspace/kaggle:ro
      - ../scripts:/workspace/scripts:ro
      - integration-results:/workspace/results
    security_opt:
      - no-new-privileges
    environment:
      - HTTPS_PROXY=${INTEGRATION_HTTPS_PROXY:-}
      - HTTP_PROXY=${INTEGRATION_HTTP_PROXY:-}

networks:
  # Standard Docker bridge network (outbound access for remote APIs; does not provide automated IP allowlisting)
  host-bridge:
    driver: bridge

volumes:
  sandbox-results:
  integration-results:
