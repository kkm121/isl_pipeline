version: '3.8'

services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    network_mode: none
    volumes:
      - ../src:/workspace/src:ro
      - ../tests:/workspace/tests:ro
      - ../configs:/workspace/configs:ro
      - sandbox-results:/workspace/results
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges

  integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    networks:
      - allowlisted
    volumes:
      - ../src:/workspace/src
      - ../kaggle:/workspace/kaggle
      - ../scripts:/workspace/scripts
      - integration-results:/workspace/results
    dns:
      - 8.8.8.8

networks:
  allowlisted:
    driver: bridge

volumes:
  sandbox-results:
  integration-results:
