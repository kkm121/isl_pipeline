[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-pipeline"
version = "0.1.0"
description = "Indian Sign Language recognition pipeline with autonomous ML engineering architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "mediapipe",
    "opencv-python-headless",
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "tqdm",
    "tensorboard"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "fastmcp",
    "mcp",
    "types-PyYAML"
]

[project.scripts]
isl_pipeline = "src.inference.predict:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
